[project]
name = "zigmo"
version = "0.1.0"
description = "A semantic-layer engine for business metrics, exposed as an MCP server."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "mcp>=2.3,<3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
zigmo-ingest = "zigmo.ingest:main"
zigmo-server = "zigmo.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zigmo"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
